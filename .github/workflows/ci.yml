name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build lcov valgrind

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install meson ninja lcov

      - name: Clean build directory
        run: rm -rf build

      - name: Configure (with coverage)
        run: |
          meson setup build -Db_coverage=true

      - name: Build
        run: |
          meson compile -C build

      - name: Run tests
        run: |
          meson test -C build --print-errorlogs

      - name: Generate coverage report
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd build
          lcov --capture --directory . --output-file coverage.info --ignore-errors mismatch,gcov
          lcov --remove coverage.info '/usr/*' --output-file coverage.info --ignore-errors unused
          lcov --remove coverage.info '*/tests/*' --output-file coverage.info --ignore-errors unused
          lcov --list coverage.info

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/coverage.info
          flags: unittests
          name: codecov-lush
          fail_ci_if_error: false
          verbose: true

  # Word CST differential audit soak. The Word CST dual-routing path is the
  # runtime default; this job runs the FULL suite with the abort-on-mismatch
  # audit (LUSH_WORD_CST_AUDIT) active, so any covered word whose CST expansion
  # diverges from the legacy path -- in value, or in the post-glob/brace field
  # vector -- aborts the run at the exact expansion point and fails CI. This is
  # the guard for every future coverage-widening change to word_eval/word_parse.
  word-cst-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build

      - name: Configure
        run: |
          meson setup build

      - name: Build
        run: |
          meson compile -C build

      - name: Run full suite under the Word CST audit
        run: |
          meson test -C build --setup lush:audit --print-errorlogs

  # AddressSanitizer + UndefinedBehaviorSanitizer build. Leak detection is
  # disabled for now: the unit suite still has known leaks tracked separately,
  # so this job gates on hard memory-safety errors (heap-buffer-overflow,
  # use-after-free, stack-overflow) and undefined behavior, not leaks. The
  # top-level `integration` suite (PTY/job-control) and `lle-benchmarks`
  # (timing-sensitive) are excluded; expand coverage once they are verified
  # clean under the sanitizers.
  sanitizer-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang meson ninja-build

      - name: Configure (address + undefined sanitizers)
        run: |
          CC=clang meson setup build \
            -Db_sanitize=address,undefined -Db_lundef=false -Dwerror=false

      - name: Build
        run: |
          meson compile -C build

      - name: Run LLE suites under sanitizers (leaks enforced)
        run: |
          ASAN_OPTIONS=detect_leaks=1 meson test -C build --print-errorlogs \
            --suite lle-unit --suite lle-functional \
            --suite lle-integration --suite lle-compliance

      # The unit suite still carries the production leaks tracked by the
      # sanitizer sweep (#471-#480); leak detection stays off here until that
      # series lands, then this step folds into the enforced run above.
      - name: Run unit suite under sanitizers (leaks off, pending #471-#480)
        run: |
          ASAN_OPTIONS=detect_leaks=0 meson test -C build --print-errorlogs \
            --suite unit

  # Memory leak detection on Linux using Valgrind
  memory-check-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build valgrind

      - name: Configure (release build for accurate leak detection)
        run: |
          meson setup build --buildtype=debugoptimized

      - name: Build
        run: |
          meson compile -C build

      - name: Run comprehensive memory check
        id: valgrind
        run: |
          # Create a comprehensive test script
          cat > /tmp/memcheck_tests.sh << 'EOF'
          # Basic execution
          echo "Testing basic execution"
          x=hello
          echo $x

          # Arrays
          arr=(one two three)
          echo ${arr[0]} ${arr[@]}
          echo ${#arr[@]}

          # Arithmetic
          (( y = 5 + 3 ))
          echo $y

          # Control structures
          for i in 1 2 3; do echo $i; done
          if true; then echo yes; fi
          case foo in foo) echo matched;; esac

          # Functions
          myfunc() { echo "in function: $1"; }
          myfunc test

          # Command substitution
          z=$(echo captured)
          echo $z

          # Pipes and redirections
          echo pipe | cat
          echo redirect > /tmp/lush_test_redirect.txt
          cat /tmp/lush_test_redirect.txt
          rm -f /tmp/lush_test_redirect.txt

          # Parameter expansion
          str="hello world"
          echo ${str^^}
          echo ${str//world/there}

          # Builtins
          type echo
          cd /tmp && pwd && cd -

          # Extended test
          [[ "foo" == "foo" ]] && echo "match"

          # Exit cleanly
          exit 0
          EOF

          # Run valgrind with comprehensive checks
          valgrind \
            --leak-check=full \
            --show-leak-kinds=definite,indirect \
            --errors-for-leak-kinds=definite \
            --error-exitcode=1 \
            --track-origins=yes \
            --log-file=valgrind-report.txt \
            ./build/lush /tmp/memcheck_tests.sh

          VALGRIND_EXIT=$?

          echo "=== Valgrind Report ==="
          cat valgrind-report.txt

          # Extract summary for annotation
          if grep -q "definitely lost: 0 bytes" valgrind-report.txt; then
            echo "memory_status=clean" >> $GITHUB_OUTPUT
          else
            echo "memory_status=leaks" >> $GITHUB_OUTPUT
          fi

          exit $VALGRIND_EXIT

      - name: Upload Valgrind report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valgrind-report-linux
          path: valgrind-report.txt

  # Memory leak detection on macOS using leaks tool
  memory-check-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install meson ninja

      - name: Configure (release build)
        run: |
          meson setup build --buildtype=debugoptimized

      - name: Build
        run: |
          meson compile -C build

      - name: Run comprehensive memory check
        id: leaks
        timeout-minutes: 5
        run: |
          # Create a simpler test script that avoids features that may cause
          # the leaks tool to hang (pipes, command substitution with subshells)
          cat > /tmp/memcheck_tests.sh << 'EOF'
          echo "Testing basic execution"
          x=hello
          echo $x
          arr=(one two three)
          echo ${arr[0]} ${arr[@]}
          (( y = 5 + 3 ))
          echo $y
          for i in 1 2 3; do echo $i; done
          if true; then echo yes; fi
          myfunc() { echo "in function: $1"; }
          myfunc test
          str="hello world"
          echo ${str^^}
          [[ "foo" == "foo" ]] && echo "match"
          # Issue #163: scalar / empty / re-array overwrite of an
          # existing array binding must release the prior
          # array_value_t backing memory. Each of these used to leak
          # a 190-byte array struct under valgrind.
          drain1=(a b c); drain1=scalar
          drain2=(a b c); drain2=
          drain3=(a b c); drain3=(d e f g)
          loopvar=(a b c); for loopvar in 1 2 3; do :; done
          # Re-init paths: config reload reinvokes config_init, and a mode
          # switch re-seeds the registry. These are the second-init paths that
          # hid the config_init reload leak from a single-init workload.
          config reload
          config reload
          mode bash
          mode zsh
          mode posix
          mode lush
          config set shell.errexit true
          config get shell.errexit
          exit 0
          EOF

          # MallocStackLogging enables memory tracking
          export MallocStackLogging=1

          # Run leaks directly. macOS has no `timeout` command (it is GNU
          # coreutils, not installed here), so the previous `timeout 120 leaks`
          # exited 127 ("command not found") on every run -- the leaks tool
          # never actually ran, and the old informational branch swallowed it
          # as a silent pass. The step-level `timeout-minutes: 5` above is the
          # hang guard; the workload avoids the pipe/subshell constructs that
          # can hang leaks(1).
          if leaks --atExit -- ./build/lush /tmp/memcheck_tests.sh > leaks-report.txt 2>&1; then
            LEAKS_EXIT=0
          else
            LEAKS_EXIT=$?
          fi

          echo "=== Leaks Report ==="
          cat leaks-report.txt || echo "(no report generated)"

          # Check for leaks (0 leaks = success)
          if grep -q "0 leaks for 0 total leaked bytes" leaks-report.txt 2>/dev/null; then
            echo "memory_status=clean" >> $GITHUB_OUTPUT
            exit 0
          elif grep -q "leaks Report Version:" leaks-report.txt 2>/dev/null; then
            # leaks tool ran but found issues
            LEAK_COUNT=$(grep -o '[0-9]* leaks for' leaks-report.txt | grep -o '[0-9]*' | head -1)
            if [ "$LEAK_COUNT" = "0" ] || [ -z "$LEAK_COUNT" ]; then
              echo "memory_status=clean" >> $GITHUB_OUTPUT
              exit 0
            else
              echo "memory_status=leaks" >> $GITHUB_OUTPUT
              echo "::error::macOS leaks detected: $LEAK_COUNT leaks found"
              # Hard gate. leaks(1) is reachability-based, so a never-freed
              # reachable singleton is NOT reported -- a nonzero count is a real
              # leak, not a false positive. If a genuine system-library leak
              # ever surfaces on the runner, add a targeted, documented filter
              # here for that specific stack; never blanket-pass.
              exit 1
            fi
          else
            echo "memory_status=unknown" >> $GITHUB_OUTPUT
            echo "::error::Could not parse leaks output (exit code: $LEAKS_EXIT)"
            # Cannot certify clean -> fail. A broken or hung leaks run must be
            # visible, not a silent green pass.
            exit 1
          fi

      - name: Upload leaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leaks-report-macos
          path: leaks-report.txt
